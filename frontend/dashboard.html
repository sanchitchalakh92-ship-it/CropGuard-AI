<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CropGuard AI - Farmer Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            background: #f5f7f5;

            color: #263238;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            background: #1b5e20;

            color: white;

            padding: 18px 5%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .brand-icon {

            font-size: 32px;
        }


        .brand h1 {

            font-size: 22px;
        }


        .logout-btn {

            border: 1px solid rgba(255,255,255,.5);

            background: transparent;

            color: white;

            padding: 9px 18px;

            border-radius: 8px;

            cursor: pointer;
        }


        .logout-btn:hover {

            background: rgba(255,255,255,.15);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .container {

            max-width: 1200px;

            margin: auto;

            padding: 30px 20px;
        }


        .welcome {

            margin-bottom: 25px;
        }


        .welcome h2 {

            color: #1b5e20;

            margin-bottom: 6px;
        }


        .welcome p {

            color: #777;
        }


        /* =====================================================
           STATISTICS
        ===================================================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }


        .stat-card {

            background: white;

            padding: 22px;

            border-radius: 14px;

            box-shadow:
                0 5px 18px rgba(0,0,0,.07);
        }


        .stat-title {

            color: #777;

            font-size: 14px;

            margin-bottom: 10px;
        }


        .stat-value {

            font-size: 32px;

            font-weight: bold;

            color: #263238;
        }


        .improving .stat-value {

            color: #2e7d32;
        }


        .stable .stat-value {

            color: #f9a825;
        }


        .worsening .stat-value {

            color: #c62828;
        }


        /* =====================================================
           SECTION
        ===================================================== */

        .section {

            background: white;

            border-radius: 14px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 18px rgba(0,0,0,.06);
        }


        .section h3 {

            color: #1b5e20;

            margin-bottom: 18px;
        }


        /* =====================================================
           HISTORY
        ===================================================== */

        .history {

            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        .history-card {

            border: 1px solid #e0e0e0;

            border-radius: 12px;

            padding: 18px;

            display: grid;

            grid-template-columns:
                1fr auto;

            gap: 15px;
        }


        .history-main h4 {

            margin-bottom: 7px;

            color: #263238;
        }


        .history-main p {

            color: #666;

            font-size: 14px;

            margin: 4px 0;
        }


        .progress {

            display: flex;

            align-items: center;

            justify-content: center;

            min-width: 130px;

            font-weight: bold;

            border-radius: 10px;

            padding: 10px;
        }


        .progress.improving {

            background: #e8f5e9;

            color: #2e7d32;
        }


        .progress.stable {

            background: #fff8e1;

            color: #f57f17;
        }


        .progress.worsening {

            background: #ffebee;

            color: #c62828;
        }


        .progress.first_scan {

            background: #e3f2fd;

            color: #1565c0;
        }


        .empty {

            text-align: center;

            color: #777;

            padding: 35px;
        }


        .loading {

            text-align: center;

            padding: 30px;

            color: #777;
        }


        /* =====================================================
           CROPS
        ===================================================== */

        .crop-list {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;
        }


        .crop-tag {

            background: #e8f5e9;

            color: #2e7d32;

            padding: 8px 13px;

            border-radius: 20px;

            font-size: 14px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 550px) {

            .header {

                padding: 15px;
            }


            .container {

                padding: 20px 12px;
            }


            .stats {

                grid-template-columns: 1fr;
            }


            .history-card {

                grid-template-columns: 1fr;
            }


            .progress {

                min-width: auto;
            }

        }

    </style>

</head>


<body>


<!-- ========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="brand">

        <div class="brand-icon">
            🌱
        </div>

        <h1>
            CropGuard AI
        </h1>

    </div>


    <button
        id="logoutBtn"
        class="logout-btn"
    >
        Logout
    </button>

</header>


<!-- ========================================================
     MAIN
========================================================= -->

<main class="container">


    <div class="welcome">

        <h2>
            Welcome, <span id="farmerName">
                Farmer
            </span> 👨‍🌾
        </h2>

        <p>
            Monitor your crop health and disease progress.
        </p>

    </div>


    <!-- =====================================================
         STATISTICS
    ====================================================== -->

    <section class="stats">


        <div class="stat-card">

            <div class="stat-title">
                Total Scans
            </div>

            <div
                id="totalScans"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat-card improving">

            <div class="stat-title">
                Improving
            </div>

            <div
                id="improving"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat-card stable">

            <div class="stat-title">
                Stable
            </div>

            <div
                id="stable"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat-card worsening">

            <div class="stat-title">
                Worsening
            </div>

            <div
                id="worsening"
                class="stat-value"
            >
                0
            </div>

        </div>


    </section>


    <!-- =====================================================
         CROPS
    ====================================================== -->

    <section class="section">

        <h3>
            🌾 My Crops
        </h3>

        <div
            id="cropList"
            class="crop-list"
        >
            <div class="loading">
                Loading crops...
            </div>
        </div>

    </section>


    <!-- =====================================================
         HISTORY
    ====================================================== -->

    <section class="section">

        <h3>
            📊 My Disease History
        </h3>

        <div
            id="history"
            class="history"
        >

            <div class="loading">
                Loading your scan history...
            </div>

        </div>

    </section>


</main>


<script src="js/authentication.js"></script>
<script src="js/dashboard.js"></script>


</body>

</html>
