<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropGuard AI - Reset Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9, #e3f2fd);
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 460px;
            background: #fff;
            padding: 38px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }
        .logo { text-align: center; font-size: 50px; margin-bottom: 8px; }
        h1 { text-align: center; color: #1b5e20; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #777; margin-bottom: 24px; line-height: 1.5; }
        .step { display: none; }
        .step.active { display: block; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; color: #333; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #43a047;
            box-shadow: 0 0 0 3px rgba(67,160,71,0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #1b5e20; }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .secondary-btn {
            background: #e8f5e9;
            color: #2e7d32;
            margin-top: 10px;
        }
        .secondary-btn:hover { background: #dcedc8; }
        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            text-align: center;
            line-height: 1.4;
        }
        .message.error { display: block; background: #ffebee; color: #c62828; }
        .message.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .hint { color: #777; font-size: 13px; margin-top: 7px; line-height: 1.4; }
        .back { text-align: center; margin-top: 22px; }
        .back a { color: #2e7d32; font-weight: bold; text-decoration: none; }
        .back a:hover { text-decoration: underline; }
        .otp-box { text-align: center; letter-spacing: 7px; font-size: 24px; font-weight: bold; }
        .timer { text-align: center; color: #666; margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">🌱</div>
    <h1>CropGuard AI</h1>
    <p class="subtitle" id="subtitle">
        Enter your registered email to receive a verification code.
    </p>

    <div id="message" class="message"></div>

    <!-- STEP 1: EMAIL -->
    <section id="step1" class="step active">
        <form id="requestForm">
            <div class="form-group">
                <label for="email">Registered Email</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    placeholder="Enter your registered email"
                    required
                >
                <div class="hint">
                    We will send a 6-digit OTP to this email.
                </div>
            </div>

            <button id="sendBtn" type="submit">
                Send OTP
            </button>
        </form>
    </section>

    <!-- STEP 2: OTP -->
    <section id="step2" class="step">
        <form id="verifyForm">
            <div class="form-group">
                <label for="otp">6-Digit OTP</label>
                <input
                    type="text"
                    id="otp"
                    class="otp-box"
                    inputmode="numeric"
                    maxlength="6"
                    autocomplete="one-time-code"
                    placeholder="000000"
                    required
                >
                <div class="hint" id="otpHint">
                    Check your email for the OTP.
                </div>
            </div>

            <button id="verifyBtn" type="submit">
                Verify OTP
            </button>

            <button
                id="resendBtn"
                type="button"
                class="secondary-btn"
                disabled
            >
                Resend OTP
            </button>

            <div id="timer" class="timer"></div>
        </form>
    </section>

    <!-- STEP 3: NEW PASSWORD -->
    <section id="step3" class="step">
        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    autocomplete="new-password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Confirm New Password
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >
            </div>

            <div class="hint" style="margin-bottom:16px;">
                Minimum 6 characters.
            </div>

            <button id="resetBtn" type="submit">
                Reset Password
            </button>
        </form>
    </section>

    <div class="back">
        <a href="/login.html">← Back to Login</a>
    </div>
</div>

<script>
(function () {
    const API_BASE = window.location.origin;

    const message = document.getElementById("message");
    const subtitle = document.getElementById("subtitle");

    const steps = [
        document.getElementById("step1"),
        document.getElementById("step2"),
        document.getElementById("step3")
    ];

    const emailInput = document.getElementById("email");
    const otpInput = document.getElementById("otp");

    const sendBtn = document.getElementById("sendBtn");
    const verifyBtn = document.getElementById("verifyBtn");
    const resendBtn = document.getElementById("resendBtn");
    const resetBtn = document.getElementById("resetBtn");

    const timer = document.getElementById("timer");
    const otpHint = document.getElementById("otpHint");

    let resetEmail = "";
    let resetToken = "";
    let countdown = null;

    function showMessage(text, type) {
        message.textContent = text || "";
        message.className = "message " + (type || "error");
        message.style.display = text ? "block" : "none";
    }

    function showStep(number) {
        steps.forEach((step, index) => {
            step.classList.toggle("active", index === number - 1);
        });

        if (number === 1) {
            subtitle.textContent =
                "Enter your registered email to receive a verification code.";
        }

        if (number === 2) {
            subtitle.textContent =
                "Verify the OTP sent to your email.";
        }

        if (number === 3) {
            subtitle.textContent =
                "Create a new password for your CropGuard AI account.";
        }
    }

    function startCountdown(seconds) {
        clearInterval(countdown);

        let remaining = Math.max(0, Number(seconds) || 60);

        resendBtn.disabled = true;

        timer.textContent =
            "You can resend the OTP in " +
            remaining +
            " seconds.";

        countdown = setInterval(function () {
            remaining -= 1;

            if (remaining <= 0) {
                clearInterval(countdown);

                timer.textContent =
                    "You can request a new OTP now.";

                resendBtn.disabled = false;
                return;
            }

            timer.textContent =
                "You can resend the OTP in " +
                remaining +
                " seconds.";
        }, 1000);
    }

    // STEP 1: REQUEST OTP
    document
        .getElementById("requestForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();
            showMessage("", "");

            const email =
                emailInput.value.trim().toLowerCase();

            if (!email) {
                showMessage(
                    "Please enter your registered email.",
                    "error"
                );
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = "Sending OTP...";

            try {
                const response = await fetch(
                    API_BASE + "/api/forgot-password/request-otp",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({
                            email: email
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || data.status !== "success") {
                    throw new Error(
                        data.message ||
                        "Could not send OTP."
                    );
                }

                resetEmail = email;

                otpHint.textContent =
                    "If this email belongs to a CropGuard account, " +
                    "an OTP has been sent to " +
                    (data.email || "your email") +
                    ".";

                showMessage(
                    data.message,
                    "success"
                );

                showStep(2);

                startCountdown(
                    data.resend_after || 60
                );

                otpInput.focus();

            } catch (error) {

                showMessage(
                    error.message ||
                    "Could not send OTP.",
                    "error"
                );

            } finally {

                sendBtn.disabled = false;
                sendBtn.textContent = "Send OTP";
            }
        });


    // STEP 2: VERIFY OTP
    document
        .getElementById("verifyForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();
            showMessage("", "");

            const otp =
                otpInput.value.replace(/\D/g, "");

            if (otp.length !== 6) {
                showMessage(
                    "Enter the 6-digit OTP.",
                    "error"
                );
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = "Verifying...";

            try {

                const response = await fetch(
                    API_BASE +
                    "/api/forgot-password/verify-otp",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({
                            email: resetEmail,
                            otp: otp
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok ||
                    data.status !== "success") {

                    throw new Error(
                        data.message ||
                        "Invalid OTP."
                    );
                }

                resetToken =
                    data.reset_token || "";

                if (!resetToken) {
                    throw new Error(
                        "Reset authorization was not created. " +
                        "Please try again."
                    );
                }

                clearInterval(countdown);
                timer.textContent = "";

                showMessage(
                    data.message,
                    "success"
                );

                showStep(3);

                document
                    .getElementById("newPassword")
                    .focus();

            } catch (error) {

                showMessage(
                    error.message ||
                    "Could not verify OTP.",
                    "error"
                );

            } finally {

                verifyBtn.disabled = false;
                verifyBtn.textContent = "Verify OTP";
            }
        });


    // RESEND OTP
    resendBtn.addEventListener(
        "click",
        async function () {

            resendBtn.disabled = true;
            showMessage("", "");

            try {

                const response = await fetch(
                    API_BASE +
                    "/api/forgot-password/resend-otp",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({
                            email: resetEmail
                        })
                    }
                );

                const data =
                    await response.json();

                if (!response.ok ||
                    data.status !== "success") {

                    throw new Error(
                        data.message ||
                        "Could not resend OTP."
                    );
                }

                showMessage(
                    data.message,
                    "success"
                );

                startCountdown(
                    data.resend_after || 60
                );

            } catch (error) {

                showMessage(
                    error.message ||
                    "Could not resend OTP.",
                    "error"
                );

                resendBtn.disabled = false;
            }
        }
    );


    // STEP 3: RESET PASSWORD
    document
        .getElementById("resetForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();
            showMessage("", "");

            const password =
                document
                    .getElementById("newPassword")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;

            if (password.length < 6) {
                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage(
                    "Passwords do not match.",
                    "error"
                );
                return;
            }

            if (!resetEmail || !resetToken) {
                showMessage(
                    "Password reset verification is missing. " +
                    "Please verify the OTP again.",
                    "error"
                );
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent =
                "Updating Password...";

            try {

                const response = await fetch(
                    API_BASE +
                    "/api/forgot-password/reset",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        credentials: "include",

                        /*
                         * IMPORTANT:
                         * app.py expects "password",
                         * NOT "new_password".
                         */
                        body: JSON.stringify({
                            email: resetEmail,
                            reset_token: resetToken,
                            password: password,
                            confirm_password: confirmPassword
                        })
                    }
                );

                const data =
                    await response.json();

                if (!response.ok ||
                    data.status !== "success") {

                    throw new Error(
                        data.message ||
                        "Could not reset password."
                    );
                }

                showMessage(
                    data.message ||
                    "Password reset successfully.",
                    "success"
                );

                resetToken = "";

                setTimeout(function () {
                    window.location.replace(
                        "/login.html"
                    );
                }, 1200);

            } catch (error) {

                showMessage(
                    error.message ||
                    "Could not reset password.",
                    "error"
                );

            } finally {

                resetBtn.disabled = false;
                resetBtn.textContent =
                    "Reset Password";
            }
        });

})();
</script>

</body>
</html>
