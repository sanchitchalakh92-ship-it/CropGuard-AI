<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropGuard AI - Farmer Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9, #e3f2fd);
            padding: 20px;
        }
        .login-container {
            width: 100%; max-width: 430px; background: white;
            padding: 40px 35px; border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }
        .logo { text-align: center; font-size: 52px; margin-bottom: 10px; }
        h1 { text-align: center; color: #1b5e20; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #777; margin-bottom: 28px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; color: #333; margin-bottom: 8px; }
        input {
            width: 100%; padding: 14px; border: 1px solid #ddd;
            border-radius: 10px; font-size: 15px; outline: none;
        }
        input:focus { border-color: #43a047; box-shadow: 0 0 0 3px rgba(67,160,71,0.1); }
        .login-btn {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            background: #2e7d32; color: white; font-size: 16px;
            font-weight: bold; cursor: pointer;
        }
        .login-btn:hover { background: #1b5e20; }
        .message { display: none; padding: 12px; margin-bottom: 18px; border-radius: 8px; text-align: center; }
        .message.error { display: block; background: #ffebee; color: #c62828; }
        .message.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .forgot-link { text-align: right; margin-top: 10px; }
        .forgot-link a, .register-link a { color: #2e7d32; font-weight: bold; text-decoration: none; }
        .forgot-link a:hover, .register-link a:hover { text-decoration: underline; }
        .register-link { text-align: center; margin-top: 24px; color: #666; }
        .divider { height: 1px; background: #eee; margin: 24px 0; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🌱</div>
        <h1>CropGuard AI</h1>
        <p class="subtitle">Farmer Login</p>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="identifier">Mobile Number or Email</label>
                <input type="text" id="identifier" name="identifier"
                       placeholder="Enter mobile or email" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter password" autocomplete="current-password" required>
                <div class="forgot-link">
                    <a href="/forgot-password.html">Forgot Password?</a>
                </div>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="divider"></div>

        <div class="register-link">
            New Farmer?
            <a href="/register.html">Create Account</a>
        </div>
    </div>

    <script src="/js/authentication.js?v=3"></script>
</body>
</html>
