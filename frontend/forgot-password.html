<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CropGuard AI - Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #eef7e9;
            color: #222;
        }

        .container {
            width: 420px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #176b2c;
            margin: 5px 0;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #2e7d32;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #256628;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-btn {
            margin-top: 10px;
            background: #eeeeee;
            color: #333;
        }

        .secondary-btn:hover {
            background: #dddddd;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            text-align: center;
            line-height: 1.4;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
        }

        .otp-input {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 8px;
        }

        .info {
            background: #f1f8e9;
            color: #33691e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .resend {
            text-align: center;
            margin-top: 15px;
        }

        .resend button {
            width: auto;
            background: none;
            color: #2e7d32;
            padding: 5px;
        }

        .back-login {
            text-align: center;
            margin-top: 22px;
        }

        .back-login a {
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
        }

        .password-note {
            font-size: 12px;
            color: #777;
            margin-top: -8px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🌱</div>

    <h1>CropGuard AI</h1>

    <p class="subtitle">Reset Your Password</p>

    <div id="message" class="message"></div>


    <!-- STEP 1 -->
    <div id="step1" class="step active">

        <div class="info">
            Enter your registered email address.
            We will send you a 6-digit OTP.
        </div>

        <label for="email">Registered Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
        >

        <button id="sendOtpBtn" onclick="sendOTP()">
            Send OTP
        </button>

    </div>


    <!-- STEP 2 -->
    <div id="step2" class="step">

        <div class="info">
            Enter the 6-digit OTP sent to your email.
        </div>

        <label for="otp">Verification OTP</label>

        <input
            type="text"
            id="otp"
            class="otp-input"
            maxlength="6"
            inputmode="numeric"
            placeholder="000000"
        >

        <button id="verifyOtpBtn" onclick="verifyOTP()">
            Verify OTP
        </button>

        <div class="resend">
            <button onclick="resendOTP()">
                Resend OTP
            </button>
        </div>

        <button
            class="secondary-btn"
            onclick="showStep(1)"
        >
            Change Email
        </button>

    </div>


    <!-- STEP 3 -->
    <div id="step3" class="step">

        <div class="info">
            OTP verified successfully.
            Create your new password.
        </div>

        <label for="newPassword">
            New Password
        </label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            autocomplete="new-password"
        >

        <div class="password-note">
            Password must contain at least 6 characters.
        </div>

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
        >

        <button id="resetBtn" onclick="resetPassword()">
            Reset Password
        </button>

    </div>


    <div class="back-login">
        <a href="/login.html">
            ← Back to Login
        </a>
    </div>

</div>


<script>

const API_BASE = window.location.origin;

let userEmail = "";
let resetToken = "";


/* --------------------------------------------------
   MESSAGE
-------------------------------------------------- */

function showMessage(message, type = "error") {

    const box = document.getElementById("message");

    box.textContent = message;

    box.className = "message show " + type;

}


/* --------------------------------------------------
   STEP CONTROL
-------------------------------------------------- */

function showStep(number) {

    document
        .querySelectorAll(".step")
        .forEach(step => step.classList.remove("active"));

    document
        .getElementById("step" + number)
        .classList.add("active");

    document
        .getElementById("message")
        .className = "message";

}


/* --------------------------------------------------
   SEND OTP
-------------------------------------------------- */

async function sendOTP() {

    const email =
        document.getElementById("email").value.trim().toLowerCase();

    if (!email) {

        showMessage(
            "Please enter your registered email address."
        );

        return;
    }

    const button =
        document.getElementById("sendOtpBtn");

    button.disabled = true;
    button.textContent = "Sending...";

    try {

        const response = await fetch(
            `${API_BASE}/api/forgot-password/request-otp`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    email: email
                })
            }
        );

        const data = await response.json();

        if (data.status === "success") {

            userEmail = email;

            showMessage(
                "OTP sent to your registered email.",
                "success"
            );

            showStep(2);

        } else {

            showMessage(
                data.message ||
                "Unable to send OTP."
            );
        }

    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to connect to the server. Please try again."
        );

    } finally {

        button.disabled = false;
        button.textContent = "Send OTP";

    }
}


/* --------------------------------------------------
   VERIFY OTP
-------------------------------------------------- */

async function verifyOTP() {

    const otp =
        document.getElementById("otp").value.trim();

    if (!/^\d{6}$/.test(otp)) {

        showMessage(
            "Please enter the 6-digit OTP."
        );

        return;
    }

    const button =
        document.getElementById("verifyOtpBtn");

    button.disabled = true;
    button.textContent = "Verifying...";

    try {

        const response = await fetch(
            `${API_BASE}/api/forgot-password/verify-otp`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    email: userEmail,
                    otp: otp
                })
            }
        );

        const data = await response.json();

        if (data.status === "success") {

            resetToken = data.reset_token;

            showMessage(
                "OTP verified successfully.",
                "success"
            );

            showStep(3);

        } else {

            showMessage(
                data.message ||
                "Invalid OTP."
            );
        }

    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to verify OTP. Please try again."
        );

    } finally {

        button.disabled = false;
        button.textContent = "Verify OTP";

    }
}


/* --------------------------------------------------
   RESEND OTP
-------------------------------------------------- */

async function resendOTP() {

    if (!userEmail) {

        showStep(1);

        return;
    }

    try {

        const response = await fetch(
            `${API_BASE}/api/forgot-password/resend-otp`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    email: userEmail
                })
            }
        );

        const data = await response.json();

        if (data.status === "success") {

            showMessage(
                "A new OTP has been sent to your email.",
                "success"
            );

        } else {

            showMessage(
                data.message ||
                "Unable to resend OTP."
            );
        }

    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to connect to the server."
        );
    }
}


/* --------------------------------------------------
   RESET PASSWORD
-------------------------------------------------- */

async function resetPassword() {

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (newPassword.length < 6) {

        showMessage(
            "Password must contain at least 6 characters."
        );

        return;
    }


    if (newPassword !== confirmPassword) {

        showMessage(
            "Passwords do not match."
        );

        return;
    }


    if (!resetToken) {

        showMessage(
            "Password reset authorization is missing. Please start again."
        );

        showStep(1);

        return;
    }


    const button =
        document.getElementById("resetBtn");

    button.disabled = true;
    button.textContent = "Updating...";


    try {

        const response = await fetch(
            `${API_BASE}/api/forgot-password/reset`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({

                    email: userEmail,

                    reset_token: resetToken,

                    new_password: newPassword,

                    confirm_password: confirmPassword

                })
            }
        );


        const data = await response.json();


        if (data.status === "success") {

            showMessage(
                "Password updated successfully. Redirecting to login...",
                "success"
            );

            setTimeout(() => {

                window.location.replace(
                    "/login.html"
                );

            }, 1500);

        } else {

            showMessage(
                data.message ||
                "Unable to reset password."
            );
        }


    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to connect to the server."
        );

    } finally {

        button.disabled = false;
        button.textContent = "Reset Password";

    }

}

</script>

</body>
</html>
